tasks.withType(Test).configureEach {
    useJUnitPlatform()

    // Allure results всегда в build/allure-results
    systemProperty "allure.results.directory", file("$buildDir/allure-results").absolutePath

    testLogging {
        events "passed", "failed", "skipped", "standardOut", "standardError"
        showStandardStreams = true
        exceptionFormat "full"
    }
}




