plugins {
    id 'java'
    id("io.freefair.lombok") version "9.1.0"
    id("io.qameta.allure") version "3.0.1"
}

group = 'org.example'
version = '1.0-SNAPSHOT'

repositories {
    mavenCentral()
}

dependencies {
    testImplementation platform('org.junit:junit-bom:5.10.0')

    testImplementation 'org.junit.jupiter:junit-jupiter'

    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    testImplementation("org.junit.jupiter:junit-jupiter-params:5.10.0")

    testImplementation("com.fasterxml.jackson.core:jackson-databind:2.20.1")

    implementation("org.aeonbits.owner:owner:1.0.12")

    testImplementation("io.qameta.allure:allure-selenide:2.30.0")

    testImplementation("io.github.bonigarcia:webdrivermanager:6.3.0")

    testImplementation("com.codeborne:selenide:7.12.1")

    testImplementation("io.qameta.allure:allure-junit5:2.30.0")

    testImplementation("org.aspectj:aspectjweaver:1.9.24")

    testImplementation("org.testng:testng:7.8.0")

    testImplementation("io.qameta.allure:allure-testng:2.30.0")

    testImplementation("io.rest-assured:rest-assured:4.4.0")

    testImplementation("io.qameta.allure:allure-rest-assured:2.12.1")

    testImplementation("com.github.javafaker:javafaker:1.0.2")

    testImplementation("org.assertj:assertj-core:3.24.2")

    testImplementation("org.seleniumhq.selenium:selenium-java:4.11.0")

    testImplementation("io.github.bonigarcia:webdrivermanager:5.4.1")
}

